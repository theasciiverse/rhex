# Builds Rhex for the Asciiverse catalog: one archive per target, named
# rhex-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a SHA256SUMS
# file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
#
# Tags look like v0.1.1+20261021-av.1: upstream's Cargo version and the
# date of the upstream commit we build, then our release. Pure Rust
# (Crossterm, Ratatui), no native libraries, so Linux builds run in Alpine
# and the binaries are static (musl). Windows builds use MSVC on Windows
# runners. Upstream's own CI (ci.yml, Nix) runs only on master and pull
# requests and is left as it is.

name: asciiverse-release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: rhex
  BIN: rhex
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -c '
            apk add --no-cache musl-dev git &&
            cargo build --release --locked &&
            strip target/release/rhex'
          sudo chown -R "$(id -u):$(id -g)" target
          file target/release/$BIN
          file target/release/$BIN | grep -q -E 'statically linked|static-pie linked'

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp target/release/$BIN LICENSE PATCHES.md stage/
          cp asciiverse/README.md stage/README.md
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/$BIN
          file target/${{ matrix.target }}/release/$BIN

      - name: Package
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN LICENSE PATCHES.md stage/
          cp asciiverse/README.md stage/README.md
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        shell: bash
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN.exe LICENSE PATCHES.md stage/
          cp asciiverse/README.md stage/README.md
          (cd stage && 7z a -tzip "../dist/$ID-${{ matrix.target }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Rhex $TAG" \
                 --notes "Rhex by Dawid Ciężarkiewicz and contributors (github.com/dpc/rhex), built for the Asciiverse catalog: one binary for Linux, macOS and Windows. MPL-2.0. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
